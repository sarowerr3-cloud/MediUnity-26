# Render Blueprint Deployment Configuration
# Officially formatted for Render.com

services:
  # 1. Backend Node.js API Web Service
  - type: web
    name: mediunity-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  # 2. Patient Portal React/Vite Static Site (Static sites are free by default on Render)
  - type: web
    name: mediunity-patient
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mediunity-api.onrender.com

  # 3. Doctor Portal React/Vite Static Site (Static sites are free by default on Render)
  - type: web
    name: mediunity-doctor
    env: static
    rootDir: frontend-doctor
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mediunity-api.onrender.com

  # 4. Admin Panel React/Vite Static Site (Static sites are free by default on Render)
  - type: web
    name: mediunity-admin
    env: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mediunity-api.onrender.com
